<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="GitHub">
  <title>GitHub</title>
  <style>
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sheen {
      0% { transform: translateX(0); }
      38% { transform: translateX(680px); }
      100% { transform: translateX(680px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .rise { animation: rise 0.55s cubic-bezier(.16,1,.3,1) both; }
    .sheen { animation: sheen 6.4s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.85s; }
    .dot { animation: pulse 3.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .sheen, .dot { animation: none; }
    }
</style>
