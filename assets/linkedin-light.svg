<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="LinkedIn">
  <title>LinkedIn</title>
  <style>
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sheen {
      0% { transform: translateX(0); }
      38% { transform: translateX(680px); }
      100% { transform: translateX(680px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .rise { animation: rise 0.55s cubic-bezier(.16,1,.3,1) both; }
    .sheen { animation: sheen 6.4s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.85s; }
    .dot { animation: pulse 3.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .sheen, .dot { animation: none; }
    }
</style>
  <g class="rise" style="animation-delay:0.10s"><rect width="56" height="56" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/><g transform="translate(12 12) scale(1.33333)"><path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></g></g>
</svg>
