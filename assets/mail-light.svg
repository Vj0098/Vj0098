<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="Email">
  <title>Email</title>
  <style>
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sheen {
      0% { transform: translateX(0); }
      38% { transform: translateX(680px); }
      100% { transform: translateX(680px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .rise { animation: rise 0.55s cubic-bezier(.16,1,.3,1) both; }
    .sheen { animation: sheen 6.4s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.85s; }
    .dot { animation: pulse 3.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .sheen, .dot { animation: none; }
    }
</style>
  <g class="rise" style="animation-delay:0.16s"><rect width="56" height="56" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/><g transform="translate(12 13) scale(1.33333)" fill="none" stroke="#0369A1" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
      <rect x="3" y="5.2" width="18" height="13.2" rx="2.2"/>
      <path d="M4.1 7.2 12 12.5 19.9 7.2"/>
    </g><circle class="dot" cx="43" cy="13" r="4" fill="#D97706"/></g>
</svg>
